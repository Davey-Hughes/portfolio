# Forgejo Actions CI. Ported from the GitHub Actions workflow this repo used to run,
# and aligned with the plaintextesports workflow that already runs on this same
# self-hosted runner — its comments record things learned from actual breakage, so the
# environment-specific choices below are deliberately identical.
#
# What had to change from the GitHub version, and why (Forgejo has no marketplace, and
# the runner is self-hosted):
#  - actions come from the code.forgejo.org mirror, pinned to a commit SHA
#  - the runner image ships no Rust, so `rustup` is installed as a step (GitHub's
#    ubuntu-latest had it preinstalled and `rustup show` was enough)
#  - Swatinem/rust-cache is a GitHub-marketplace action; caching is done with
#    actions/cache and explicit paths instead. Consequence: an entry is written
#    once per Cargo.lock hash and never refreshed, so the dep artifacts stay
#    cached but this crate's own artifacts rebuild each run. The dep tree is the
#    expensive part, so that is the bulk of the win either way.
#  - the image is built with `docker buildx build --push` against the host Docker
#    daemon (the runner mounts its socket in), not docker/build-push-action
#  - the registry is forge.daveynet.xyz — NOT the git host — authed with the
#    REGISTRY_USER / REGISTRY_TOKEN repo secrets (GitHub's automatic GITHUB_TOKEN has
#    no equivalent here — a package-write token must be set on the repo)
#  - the weekly ghcr-cleanup workflow is gone: it wrapped a GHCR-only action with no
#    Forgejo counterpart. Package retention belongs in Forgejo's own cleanup rules.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# One CI run per ref; a newer push cancels the in-flight run (checks + image build).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: docker # runner default image: node + git + curl, so the JS actions below work
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # rust-toolchain.toml pins the channel (nightly), the rustfmt/clippy components,
      # and the wasm32 target; `rustup show` installs exactly that. Installed with
      # `--default-toolchain none` so rustup does NOT first pull stable, then discard it.
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      # Cache the cargo registry + target dir across runs — a Leptos dep tree is large,
      # so a cold clippy+test compile is minutes; this makes unchanged-dep runs quick.
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ssr-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-ssr-
      - name: Format
        run: cargo fmt --all --check
      # `ssr` is the server build; the majority of the crate is behind it, so linting
      # and testing without it would skip most of the code. --all-targets also covers
      # the benches + examples.
      - name: Clippy
        run: cargo clippy --features ssr --all-targets -- -D warnings
      # No --lib, matching what `cargo ci` (xtask/src/main.rs) runs locally. The three
      # harness=false benches are `required-features = ["ssr"]`; cargo runs them in test
      # mode here, which executes each once without measuring.
      - name: Test
        run: cargo test --features ssr

  # The other half of `cargo leptos test`. That command is exactly two cargo
  # invocations — the `rust` job above is the server one, this is the client one:
  #
  #   cargo test --lib --no-default-features --features hydrate
  #
  # It adds no new test *functions*. What it adds is running them compiled under
  # `hydrate` instead of `ssr`, which is the only thing in CI that compiles the
  # #[cfg(test)] modules against the client feature set. A test module behind a broken
  # #[cfg] would otherwise never surface: `cargo leptos build` compiles the hydrate lib,
  # but a non-test build never compiles the test modules.
  #
  # Its own job rather than a step in `rust` because it runs concurrently, so this
  # costs no CI wall clock.
  hydrate:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key namespace: the whole dep tree compiles under a different
          # feature set here, so these artifacts share nothing with the `rust` job's.
          key: cargo-hydrate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-hydrate-
      # The `rust` job's clippy runs `--features ssr`, which never compiles the
      # client-only code — the 15 `#[cfg(feature = "hydrate")]` sites across
      # src/app.rs (the pinch-zoom anchor and touch handlers), src/config.rs and
      # src/lib.rs went unlinted end to end before this job existed.
      - name: Clippy (hydrate)
        run: cargo clippy --lib --no-default-features --features hydrate -- -D warnings
      - name: Test (hydrate)
        run: cargo test --lib --no-default-features --features hydrate

  # The hydration bundle ships to every visitor, so its size is budgeted in
  # scripts/perf/wasm-budget.txt (gzip_kb=430). The budget and the script that checks
  # it both existed already — but nothing ran the script, so nothing stopped the bundle
  # from drifting past the ceiling. This job is the part that was missing. It does NOT
  # gate the image build below: an oversized bundle is a deliberate-decision problem,
  # not a broken build, and shouldn't block a deploy.
  wasm:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own key namespace: this job compiles the wasm32 target under the
          # wasm-release profile, which the `rust` job above never builds.
          key: cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-wasm-
      # The version is read out of the Dockerfile's CARGO_LEPTOS_VERSION ARG rather than
      # duplicated here, so CI and the image cannot drift: cargo-leptos embeds a
      # wasm-bindgen schema that must match the crate exactly, and a copy of the number
      # in two files is a copy that eventually disagrees. Bump it in the Dockerfile.
      #
      # The Dockerfile additionally apk-adds sass + binaryen because it builds on musl;
      # on this glibc runner image cargo-leptos fetches dart-sass (for style/main.scss)
      # and wasm-opt itself.
      - name: Install cargo-leptos
        run: |
          set -eu
          V="$(grep -m1 '^ARG CARGO_LEPTOS_VERSION=' Dockerfile | cut -d= -f2)"
          if [ -z "$V" ]; then
            echo "could not read CARGO_LEPTOS_VERSION from Dockerfile" >&2
            exit 1
          fi
          echo "installing cargo-leptos $V (pinned in Dockerfile)"
          curl --proto '=https' --tlsv1.3 -LsSf \
            "https://github.com/leptos-rs/cargo-leptos/releases/download/v${V}/cargo-leptos-installer.sh" | sh
      # Only a release build emits the optimized, wasm-opt'd bundle wasm_size.sh
      # measures (lib-profile-release = "wasm-release"); a dev build is much larger.
      - name: Build
        run: cargo leptos build --release
      # Exits 2 when over budget, failing the job. Raising the ceiling is a
      # deliberate act: edit wasm-budget.txt and say why.
      - name: Bundle size vs budget
        run: scripts/perf/wasm_size.sh

  # Playwright end-to-end suite: 9 specs, 118 tests across chromium + firefox. Nothing
  # ran them before this job, and they had rotted accordingly — the path-traversal spec
  # pinned a status code the server never returns, and every photo-detail test plus three
  # gallery tests open with an unguarded waitForSelector(".photo-hero-link"), which throws
  # on an empty gallery. public/images/* is gitignored, so a fresh checkout has no photos
  # at all; the fixture step below generates them.
  #
  # Deliberately NOT a gate on the docker job below. Browser tests are the flakiest thing
  # in this workflow and an image build should not queue behind them; playwright.config.ts
  # already sets retries: 2 and workers: 1 under CI to absorb the ordinary noise, and a
  # genuine regression still shows up as a red e2e job.
  e2e:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Its own namespace: this job builds the release binary plus the gen_fixtures
          # example, which neither the rust nor the wasm job produces.
          key: cargo-e2e-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-e2e-
      # Same pin the Dockerfile and the wasm job use — read from the Dockerfile so the
      # version lives in exactly one place. See the ARGs at the top of the Dockerfile.
      - name: Install cargo-leptos
        run: |
          set -eu
          V="$(grep -m1 '^ARG CARGO_LEPTOS_VERSION=' Dockerfile | cut -d= -f2)"
          if [ -z "$V" ]; then
            echo "could not read CARGO_LEPTOS_VERSION from Dockerfile" >&2
            exit 1
          fi
          curl --proto '=https' --tlsv1.3 -LsSf \
            "https://github.com/leptos-rs/cargo-leptos/releases/download/v${V}/cargo-leptos-installer.sh" | sh
      # Release, not debug: hash-files=true only resolves correctly against the hashed
      # assets a release build emits, which is also what the image ships.
      - name: Build
        run: cargo leptos build --release
      # public/images/* is gitignored, so this is the only source of photos in CI. Writes
      # 3 JPEGs with EXIF lifted from real frames into public/images/home/, plus a
      # config.toml + about.txt into target/e2e-fixtures/ (consumed by CONFIG_PATH and
      # ABOUT_CONTENT_PATH below) so the site name — and therefore every title assertion
      # — is deterministic instead of depending on SiteConfig::default().
      - name: Generate the fixture gallery
        run: cargo run --release --example gen_fixtures --features ssr
      - name: Install e2e dependencies
        working-directory: end2end
        run: npm ci
      # ~400 MB of browsers; keyed on the lockfile because the required builds are
      # pinned by the @playwright/test version recorded there.
      - uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('end2end/package-lock.json') }}
          restore-keys: playwright-
      # --with-deps also apt-installs the shared libraries the browsers link against,
      # which a cache restore does not provide, so it runs even on a cache hit.
      - name: Install browsers
        working-directory: end2end
        run: npx playwright install --with-deps chromium firefox
      # The server is started here rather than via `cargo leptos end-to-end` on purpose:
      # in cargo-leptos 0.3.7 that command panics on teardown after playwright exits
      # ("ProcessHandle should not have been dropped", end2end.rs:27), which would turn a
      # green suite into a failed job. Port 4000 is playwright.config.ts's baseURL, set by
      # site-addr in Cargo.toml.
      #
      # CONFIG_PATH / ABOUT_CONTENT_PATH point at the generated fixtures. Without them
      # load_config() falls through to SiteConfig::default(), whose site_name is the
      # placeholder "Your Name" — so the specs' "Photography Portfolio" title assertions
      # would only pass if config loading *failed*, which is not something a test should
      # rely on.
      #
      # --reporter=line because the configured `html` reporter writes a directory nobody
      # collects here; line puts failures directly in the job log.
      - name: Run Playwright
        env:
          CONFIG_PATH: target/e2e-fixtures/config.toml
          ABOUT_CONTENT_PATH: target/e2e-fixtures
        run: |
          set -u
          cargo leptos serve --release > /tmp/e2e-server.log 2>&1 &
          SRV=$!
          cleanup() {
            kill "$SRV" 2>/dev/null || true
            wait "$SRV" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          ready=0
          i=0
          while [ "$i" -lt 180 ]; do
            if curl -sf http://127.0.0.1:4000/healthz >/dev/null 2>&1; then ready=1; break; fi
            i=$((i + 1))
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "server never became ready; last 40 lines of its log:" >&2
            tail -40 /tmp/e2e-server.log >&2
            exit 1
          fi
          echo "server ready after ${i}s"

          cd end2end
          CI=1 npx playwright test --reporter=line

  # Build + publish the container image to the Forgejo registry — but ONLY after the rust +
  # hydrate checks pass (a red build never ships an image), and never on a pull request.
  # Tags: latest (default branch), branch name, short SHA, and full semver on a v* tag. The
  # image is built by the repo's Dockerfile (cargo-leptos release build → slim Alpine runtime).
  docker:
    needs: [rust, hydrate]
    if: >-
      !cancelled()
      && github.event_name != 'pull_request'
      && needs.rust.result == 'success'
      && needs.hydrate.result == 'success'
    runs-on: docker # runner default image + the host docker socket the runner mounts in
    steps:
      - uses: https://code.forgejo.org/actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # The job image has git + node (needed by the checkout action, so we can't swap to a
      # CLI-only image) but no docker CLI. Drop in the static docker client plus the buildx
      # plugin; both talk to the daemon socket the runner mounts. Bump the pins as needed.
      - name: Install the docker CLI + buildx plugin
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-27.5.1.tgz | tar xz -C /usr/local/bin --strip-components=1 docker/docker
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -fsSL https://github.com/docker/buildx/releases/download/v0.19.3/buildx-v0.19.3.linux-amd64 -o "$HOME/.docker/cli-plugins/docker-buildx"
          chmod +x "$HOME/.docker/cli-plugins/docker-buildx"
      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login forge.daveynet.xyz -u "${{ secrets.REGISTRY_USER }}" --password-stdin
      # Build in an isolated `docker-container` builder, NOT the daemon's default `docker`
      # driver. Why: this runner builds on the host Docker daemon (host-socket), and the
      # default driver LOADS every built tag into that shared image store — each build then
      # drags the local `:latest` tag onto the new image, so a running container's image
      # silently loses its `:latest` tag and update-watchers anchor on a stale immutable
      # `sha-*` tag. The docker-container driver pushes straight to the registry without
      # touching the host image store.
      #
      # Reattach, don't rebuild: each job gets a fresh buildx *config*, but the buildkit
      # container and its `_state` cache volume persist on the host daemon. `buildx create`
      # isn't idempotent, so drop any stale container by name — `docker rm`, NOT
      # `docker buildx rm` (which would also delete the cache volume) — then recreate the
      # builder. It re-mounts the same `_state` volume, so the BuildKit cache (including the
      # Rust compile) stays warm across runs.
      #
      # The builder name is repo-specific on purpose: plaintextesports uses `pte-ci` on this
      # same runner, so the `docker rm -f` below can't kill its in-flight build or evict its
      # cache volume. Do not reuse a name across repos.
      - name: Set up an isolated buildx builder (keeps CI out of the host image store)
        run: |
          docker rm -f buildx_buildkit_pf-ci0 >/dev/null 2>&1 || true
          docker buildx create --name pf-ci --driver docker-container --use
      # Reproduces what docker/metadata-action generated on GitHub: sha-<short> always;
      # the branch name (and `latest`) on a branch push; the three semver forms on a v* tag.
      # Slashes in a branch name become `-` because a Docker tag cannot contain `/`.
      - name: Compute tags
        id: t
        env: # values via env, not inline ${{ }}, so a crafted ref name can't inject shell
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          IMG="forge.daveynet.xyz/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          TAGS="$IMG:sha-$(echo "$SHA" | cut -c1-7)"
          case "$REF" in
            refs/heads/main)
              TAGS="$TAGS,$IMG:main,$IMG:latest" ;;
            refs/heads/*)
              TAGS="$TAGS,$IMG:$(echo "$REF_NAME" | tr '/' '-')" ;;
            refs/tags/v*)
              V="${REF_NAME#v}"
              TAGS="$TAGS,$IMG:$V,$IMG:${V%.*},$IMG:${V%%.*}" ;;
          esac
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      # No registry cache (GitHub used cache-from/to: type=gha, which has no Forgejo
      # equivalent). The persistent `pf-ci` builder above keeps a local BuildKit cache
      # instead — warm across runs, so unchanged stages are reused; it just isn't exported
      # off-box. That also sidesteps Cloudflare's 100 MB request-body cap, which rejects
      # large mode=max cache blobs with a 413.
      #
      # --provenance/--sbom OFF: buildx otherwise wraps the image in an OCI index with
      # attestation manifests, which Forgejo doesn't register/display as a normal container
      # package. Off = plain manifest. `--push` ships every tag in one pass.
      - name: Build & push
        env: # values via env, not inline ${{ }}
          TAGS: ${{ steps.t.outputs.tags }}
        run: |
          set -eu
          ARGS=""
          for t in $(echo "$TAGS" | tr ',' ' '); do ARGS="$ARGS -t $t"; done
          docker buildx build --builder pf-ci $ARGS \
            --provenance=false --sbom=false \
            --push .
