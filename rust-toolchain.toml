[toolchain]
# Pinned to a dated nightly so CI, the image build and a local checkout all lint with
# the same clippy, and so a CI run on unchanged code (a scheduled rebuild, say) can't
# fail just because a newer nightly shipped. Floating `nightly` did exactly that on
# 2026-10-27. Why this date: leptos_macro 0.8.x writes prop-name docs for every
# #[component] (`- **gallery_name**: …`, no backticks), and newer nightlies'
# doc_markdown flags them. A per-component #[allow] doesn't reach the generated props
# struct, so the choice was this pin or turning doc_markdown off crate-wide; the pin
# keeps the lint on for hand-written docs. plaintextesports pinned this date for the
# same leptos_macro reason.
# Bump deliberately: change the date, run `cargo ci`, and fix what it finds or stay
# on this date.
# This is rustc 1.101.0-nightly (21b707e3f 2026-09-30).
channel = "nightly-2026-10-01"
# rustfmt + clippy so CI (and a fresh local install) always has the components the
# format/lint steps need; wasm32 is the hydrate/client build target for cargo-leptos.
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
